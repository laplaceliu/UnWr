# UnWr —— Unlimited Writing 的 DSH 插件配置层（源码版开发用）。
#
# 适用：从 DSH **源码**启动（可直接加载 .ts）。
# 若你用的是 npx 安装版 DSH，它不含 tsx，需改用打包后的 bundle：
#   pnpm build   →  dist/unwr-novel.mjs
# 配置方式见 README「在 DSH 中运行」。
#
# ── 路径说明 ──────────────────────────────────────────────
# DSH 要求插件 name 必须是**可直接 import 的字符串**，且 loader（>=1.0.3）
# 只对 config / disabled 字段做 `!!js` 求值，**name 字段不求值**——写
# `!!js` 表达式会在加载时报 "name.startsWith is not a function"。
# 因此本文件用占位符 __UNWR_ROOT__，由 scripts/sync-cordis-patch.mjs
# 生成 dist/cordis.local.yml（已 gitignore）供 --patch 使用：
#
#   pnpm sync:patch
#   pnpm dsh web --patch <UNWR_ROOT>/dist/cordis.local.yml --port 3082
#
# 占位符未被替换时（直接把本文件传给 --patch）会在 sync 校验阶段报错，
# 不会静默用错路径。仓库内不出现个人绝对路径（隐私红线）。
# ──────────────────────────────────────────────────────────

- insert:
    # 小说领域工具层：注册 novel_* 工具。
    #
    # 注意：@unwr/feishu 是**纯库**而非插件（无 apply，不注册进 cordis 树），
    # 由 @unwr/novel 直接 import。实机验证发现：强行把纯 re-export 模块注册为
    # 插件会报 "expect function or object with an apply method"。
    - id: unwr-novel
      name: __UNWR_ROOT__/packages/novel/src/index.ts
      config:
        # 安全模式：不注册任何删除类工具
        readOnlySafeMode: true
        # 加载时向 stderr 打印已注册工具清单
        verbose: true
